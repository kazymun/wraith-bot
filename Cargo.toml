[package]
name = "wraith-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sled = "0.34"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
bincode = "1.3"
anyhow = "1"
dotenvy = "0.15"
sha2 = "0.10"
solana-sdk = "1.18"
bs58 = "0.5"

[profile.release]
opt-level = 3
